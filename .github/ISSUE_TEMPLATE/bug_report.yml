name: Bug report
description: Report unexpected behavior with reproducible details.
title: "[Bug] "
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior. Remove personal paths and sensitive report data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: App version and Windows edition/build
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Cache scanning or recycling
        - Storage analysis
        - Windows maintenance
        - Setup or uninstall
        - Appearance or accessibility
        - Other
  - type: textarea
    attributes:
      label: Sanitized output or screenshots
      description: Do not attach a full journal containing personal paths.
